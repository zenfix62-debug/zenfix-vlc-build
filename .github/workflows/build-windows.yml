name: Build Zenfix VLC Windows x64

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      RELEASE_TAG: v0.1.0-beta.1
      RELEASE_TITLE: Zenfix VLC v0.1 Beta 1
      RELEASE_ZIP: ZenfixVLC-v0.1.0-beta.1-win64.zip
      SOURCE_TGZ: ZenfixVLC-v0.1.0-beta.1-source.tar.gz

    steps:
      - name: Checkout Zenfix overlay
        uses: actions/checkout@v4

      - name: Build Windows x64 VLC in official VideoLAN image
        env:
          VLC_BUILD_IMAGE: registry.videolan.org/vlc-debian-win64-posix:20260611225331
        run: |
          docker pull "$VLC_BUILD_IMAGE"
          docker run --rm \
            -u 0:0 \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$VLC_BUILD_IMAGE" \
            bash -lc '
              set -euxo pipefail

              # Validate our patch scripts before touching VLC.
              python3 -m py_compile scripts/apply_zenfix.py scripts/apply_zenfix_extras.py scripts/fix_zenfix_extras.py scripts/apply_zenfix_ru_runtime.py

              rm -rf vlc
              git clone https://github.com/videolan/vlc.git vlc
              cd vlc
              git checkout da266629fdffc4bee4560d9c818efd16217efeda

              # The pinned VLC revision asks the contrib system for Qt ShaderTools
              # from a VideoLAN mirror / Qt URL that currently returns 404 from CI.
              # Seed the exact upstream tarball from a Qt mirror so `make tools`
              # can verify it against VLCs own SHA512SUMS and continue normally.
              mkdir -p contrib/tarballs
              curl -fL --retry 5 --retry-all-errors \
                -o contrib/tarballs/qtshadertools-everywhere-src-6.8.3.tar.xz \
                https://qt.mirror.constant.com/archive/qt/6.8/6.8.3/submodules/qtshadertools-everywhere-src-6.8.3.tar.xz

              cd /work
              python3 scripts/apply_zenfix.py vlc
              python3 scripts/apply_zenfix_extras.py vlc
              python3 scripts/fix_zenfix_extras.py vlc
              python3 scripts/apply_zenfix_ru_runtime.py vlc

              # Fail early if the Russian catalog is syntactically invalid,
              # native trim was not patched, or the runtime fallback is missing.
              msgfmt --check --check-format -o /tmp/zenfix-ru.mo vlc/po/ru.po
              grep -Fq "Trim Video..." vlc/modules/gui/qt/menus/menus.cpp
              grep -Fq "void DialogsProvider::trimVideoDialog()" vlc/modules/gui/qt/dialogs/dialogs_provider.cpp
              grep -Fq "Zenfix fallbacks" vlc/modules/gui/qt/qt.cpp
              grep -Fq "Обрезать видео..." vlc/modules/gui/qt/qt.cpp
              grep -Fq "Плейлисты не найдены" vlc/modules/gui/qt/qt.cpp
              grep -Fq "Закреплённая очередь воспроизведения" vlc/modules/gui/qt/qt.cpp

              cd vlc
              export JOBS=4
              export MESON_BUILD="-j 2"
              export VLC_CONTRIB_SHA="$(extras/ci/get-contrib-sha.sh win64)"
              export VLC_PREBUILT_CONTRIBS_URL="https://artifacts.videolan.org/vlc/win64/vlc-contrib-x86_64-w64-mingw32-${VLC_CONTRIB_SHA}.tar.zst"
              echo "Using prebuilt contribs: ${VLC_PREBUILT_CONTRIBS_URL}"
              extras/ci/check-url.sh "${VLC_PREBUILT_CONTRIBS_URL}"

              # -l enables VLC translations/locales in the Windows package.
              extras/package/win32/build.sh -a x86_64 -p -l
              cd win64
              make package-win-common
            '

      - name: Package portable Windows folder
        run: |
          python3 - <<'PY'
          import pathlib, shutil
          candidates=[]
          for p in pathlib.Path('vlc/win64').glob('vlc-*-dev'):
              if p.is_dir() and (p/'vlc.exe').exists():
                  candidates.append(p)
          for p in pathlib.Path('vlc/win64').glob('vlc-*'):
              if p.is_dir() and (p/'vlc.exe').exists():
                  candidates.append(p)
          if not candidates:
              raise SystemExit('No packaged VLC folder with vlc.exe found')
          src=sorted(set(candidates), key=lambda p: len(str(p)))[0]
          dst=pathlib.Path('dist/ZenfixVLC-ProCompact-Glass-win64')
          if dst.exists(): shutil.rmtree(dst)
          dst.parent.mkdir(parents=True, exist_ok=True)
          shutil.copytree(src,dst)
          print('Packaged',src,'->',dst)
          PY

      - name: Create distributable ZIP
        run: |
          rm -f "$RELEASE_ZIP"
          cd dist
          zip -r -9 "../$RELEASE_ZIP" ZenfixVLC-ProCompact-Glass-win64
          cd ..
          ls -lh "$RELEASE_ZIP"

      - name: Create corresponding source archive
        run: |
          rm -f "$SOURCE_TGZ"
          tar \
            --exclude='vlc/.git' \
            --exclude='vlc/win64' \
            --exclude='vlc/contrib/tarballs' \
            -czf "$SOURCE_TGZ" \
            vlc overlay scripts README.md .github/workflows/build-windows.yml
          ls -lh "$SOURCE_TGZ"

      - name: Upload Zenfix VLC artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZenfixVLC-ProCompact-Glass-win64
          path: dist/ZenfixVLC-ProCompact-Glass-win64
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          fi

          cat > /tmp/release-notes.md <<'EOF'
          First public beta of Zenfix VLC — Pro Compact + Glass for Windows x64.

          Included in this build:
          - Native VLC 4 Qt/QML based interface.
          - Zenfix Pro Compact + Glass UI work.
          - Russian localization fixes for new VLC 4 UI strings.
          - Native Tools -> Trim Video function.
          - Portable Windows x64 package; no installer required.

          This is a beta build. Keep your normal VLC installation until Zenfix VLC is considered stable.

          Based on VideoLAN VLC source commit da266629fdffc4bee4560d9c818efd16217efeda.
          The corresponding patched source archive is attached to this release.
          EOF

          gh release create "$RELEASE_TAG" \
            "$RELEASE_ZIP" \
            "$SOURCE_TGZ" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file /tmp/release-notes.md \
            --prerelease
